<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán đơn hàng - JavaBuilder Store</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/checkout.css}">
</head>
<body>

    <header>
        <a href="/" class="logo">
            <i class="fa-solid fa-cube"></i>
            <span>JavaBuilder Store</span>
        </a>
    </header>

    <div class="container">
        <a href="/" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Quay lại cửa hàng
        </a>

        <div class="checkout-layout" id="checkout-layout">
            <!-- Left Side: Items List -->
            <div class="cart-list-card">
                <div class="card-header">
                    <h3 class="card-title">Đơn hàng của bạn</h3>
                    <button class="clear-cart" onclick="clearCart()">Xóa giỏ hàng</button>
                </div>

                <div class="cart-items-wrapper" id="cart-items-container">
                    <!-- Dynamic rendering -->
                </div>
            </div>

            <!-- Right Side: Order Summary -->
            <div class="summary-card">
                <h3 class="summary-title">Tóm tắt thanh toán</h3>
                
                <div class="currency-selector">
                    <label for="currency-select">Tiền tệ thanh toán:</label>
                    <select id="currency-select" onchange="updateCartUI()">
                        <option value="VND">VND (đ)</option>
                        <option value="USD">USD ($)</option>
                    </select>
                </div>

                <div class="summary-row">
                    <span>Tổng số sản phẩm:</span>
                    <span id="total-qty">0</span>
                </div>
                
                <div class="summary-row">
                    <span>Phương thức:</span>
                    <strong>Stripe Checkout</strong>
                </div>

                <div class="summary-row total">
                    <span>Cần thanh toán:</span>
                    <span id="total-amount">0 ₫</span>
                </div>
                
                <button class="checkout-btn" id="checkout-button" disabled onclick="checkoutWithStripe()">
                    <i class="fa-brands fa-stripe"></i> Tiến hành thanh toán
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Đang kết nối cổng thanh toán Stripe...</div>
    </div>

    <script>
        let cart = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            updateCartUI();
        });

        function updateQuantity(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function formatCurrency(amount, currency) {
            if (currency === 'VND') {
                return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
            } else {
                const usdAmount = amount / 25000;
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(usdAmount);
            }
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items-container');
            const totalQtyElement = document.getElementById('total-qty');
            const totalAmountElement = document.getElementById('total-amount');
            const checkoutBtn = document.getElementById('checkout-button');
            const selectedCurrency = document.getElementById('currency-select').value;
            const checkoutLayout = document.getElementById('checkout-layout');

            cartItemsContainer.innerHTML = '';

            if (cart.length === 0) {
                checkoutLayout.innerHTML = `
                    <div class="cart-list-card" style="grid-column: span 2;">
                        <div class="cart-empty">
                            <i class="fa-solid fa-shopping-cart"></i>
                            <p style="font-size: 16px; font-weight: 500; color: var(--text-main);">Giỏ hàng đang trống</p>
                            <p style="font-size: 14px; margin-bottom: 10px;">Vui lòng quay lại cửa hàng để lựa chọn các sản phẩm phù hợp.</p>
                            <a href="/" class="shop-btn">Quay lại cửa hàng</a>
                        </div>
                    </div>
                `;
                return;
            }

            let totalQty = 0;
            let totalAmount = 0;

            cart.forEach(item => {
                totalQty += item.quantity;
                totalAmount += item.price * item.quantity;

                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <div class="item-details">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">${formatCurrency(item.price, selectedCurrency)}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                            <span class="item-qty">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                        <i class="fa-solid fa-trash-can remove-btn" onclick="removeItem(${item.id})"></i>
                    </div>
                `;
                cartItemsContainer.appendChild(itemElement);
            });

            totalQtyElement.textContent = totalQty;
            totalAmountElement.textContent = formatCurrency(totalAmount, selectedCurrency);
            checkoutBtn.disabled = false;
        }

        async function checkoutWithStripe() {
            if (cart.length === 0) return;

            const selectedCurrency = document.getElementById('currency-select').value;
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('active');

            const orderPayload = {
                items: cart.map(item => ({
                    productId: item.id,
                    quantity: item.quantity
                })),
                currency: selectedCurrency
            };

            try {
                const orderResponse = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderPayload)
                });

                if (!orderResponse.ok) {
                    throw new Error('Đặt hàng thất bại. Vui lòng thử lại!');
                }

                const orderResult = await orderResponse.json();
                const orderCode = orderResult.data.orderCode;

                const checkoutPayload = {
                    orderCode: orderCode,
                    paymentGateway: 'STRIPE'
                };

                const checkoutResponse = await fetch('/api/payments/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(checkoutPayload)
                });

                if (!checkoutResponse.ok) {
                    throw new Error('Không thể kết nối dịch vụ thanh toán Stripe!');
                }

                const checkoutResult = await checkoutResponse.json();
                const paymentUrl = checkoutResult.data.paymentUrl;

                // Clear cart locally
                cart = [];
                localStorage.setItem('cart', JSON.stringify(cart));

                window.location.href = paymentUrl;

            } catch (error) {
                overlay.classList.remove('active');
                alert(error.message);
            }
        }
    </script>
</body>
</html>
