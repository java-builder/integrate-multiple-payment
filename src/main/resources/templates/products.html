<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaBuilder Store - Sản phẩm</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>

    <header>
        <a href="/" class="logo">
            <i class="fa-solid fa-cube"></i>
            <span>JavaBuilder Store</span>
        </a>
        <a href="/checkout" class="cart-link">
            <i class="fa-solid fa-shopping-bag"></i>
            <span>Giỏ hàng</span>
            <div class="cart-count" id="cart-count">0</div>
        </a>
    </header>

    <div class="container">
        <h2 class="section-title">Sản phẩm nổi bật</h2>
        
        <div class="products-grid">
            <div class="product-card" th:each="product : ${products}">
                <div class="product-image-container">
                    <img th:if="${product.imageUrl != null && !product.imageUrl.isEmpty()}" 
                         th:src="${product.imageUrl}" 
                         th:alt="${product.name}">
                    <i th:unless="${product.imageUrl != null && !product.imageUrl.isEmpty()}" 
                       class="fa-solid fa-image product-image-placeholder"></i>
                </div>
                
                <div class="product-info">
                    <h3 class="product-name" th:text="${product.name}">Tên sản phẩm</h3>
                    <p class="product-desc" th:text="${product.description}">Mô tả sản phẩm</p>
                    <div class="product-price" th:data-price="${product.price}" 
                         th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
                </div>
                
                <div class="product-meta">
                    <span>Kho: <strong th:text="${product.quantity}">10</strong> sản phẩm</span>
                    <span>Hỗ trợ trả góp 0%</span>
                </div>
                
                <div class="card-actions">
                    <a th:href="@{/products/{id}(id=${product.id})}" class="action-btn btn-secondary">
                        Chi tiết
                    </a>
                    <button class="action-btn btn-primary" 
                            th:data-id="${product.id}" 
                            th:data-name="${product.name}" 
                            th:data-price="${product.price}"
                            onclick="addToCart(this)">
                        Thêm vào giỏ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Đã thêm vào giỏ hàng!</span>
    </div>

    <script>
        let cart = [];

        // Load cart from localStorage on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            updateCartBadge();
        });

        function addToCart(button) {
            const id = parseInt(button.getAttribute('data-id'));
            const name = button.getAttribute('data-name');
            const price = parseFloat(button.getAttribute('data-price'));

            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }

            // Save to localStorage
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`Đã thêm "${name}" vào giỏ hàng!`);
        }

        function updateCartBadge() {
            document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 2500);
        }
    </script>
</body>
</html>
