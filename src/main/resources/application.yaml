spring:
  application:
    name: stripe

  datasource:
    url: jdbc:mysql://localhost:3306/javabuilder_stripe
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_mock_key}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/api/payments/success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/api/payments/cancel}
